# Quarkus Configuration
quarkus.application.name=oracle-mcp-server
quarkus.http.port=8080

# Logging Configuration
quarkus.log.level=INFO
quarkus.log.category."com.example.mcp".level=DEBUG
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n

# Jackson Configuration
quarkus.jackson.serialization-inclusion=non-null
quarkus.jackson.fail-on-unknown-properties=false

# LangChain4J Configuration
# Configure your LLM provider (OpenAI, Azure, etc.)
# quarkus.langchain4j.openai.api-key=${OPENAI_API_KEY}
# quarkus.langchain4j.openai.chat-model.model-name=gpt-4
# quarkus.langchain4j.openai.timeout=60s

# CORS Configuration (if needed for web clients)
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with

# Development mode settings
%dev.quarkus.log.level=DEBUG
%dev.quarkus.http.port=8080

# Production mode settings
%prod.quarkus.log.level=INFO
